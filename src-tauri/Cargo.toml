[package]
name = "monaco-lsp-demo"
version = "0.1.0"
description = "Tauri + Monaco Editor + TypeScript language server 的最小 IDE 原型"
edition = "2024"
rust-version = "1.90"

[lib]
name = "monaco_lsp_demo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
log = "0.4"
